name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    name: Gungraun PR Bench
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@d11235d565d35aac2d9ac6fb84af7830021958e5 # v1.0.0
    with:
      action_ref: d11235d565d35aac2d9ac6fb84af7830021958e5
      backend: gungraun
      auto_discover: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]
      regression_threshold_pct: 8
      fail_on_regression: true
