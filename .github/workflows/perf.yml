name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    name: Gungraun PR Bench
    uses: terjekv/github-action-iai-callgrind/.github/workflows/rust-pr-bench.yml@85505416b19a0882644d4e704d80d90a98e1ee52 # v3
    with:
      backend: gungraun
      auto_discover: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]
      regression_threshold_pct: 8
      fail_on_regression: true
